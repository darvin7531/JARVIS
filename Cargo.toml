[workspace]
members = ["."]
resolver = "2"

[package]
name = "jarvis"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
signal-hook = "=0.3.18"

rusqlite = { version = "=0.32.1", features = ["bundled", "backup"] }
