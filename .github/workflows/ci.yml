name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - run: cargo test --locked --test tool_broker approval_cannot_be_issued_for_missing_or_stale_task
      - run: cargo test --locked --test tool_broker backup_does_not_revive_pending_approval
      - run: cargo test --locked --test tool_broker approval_rejected_after_task_revision_changes
      - run: cargo test --locked --test tool_broker audit_write_failure_prevents_execution_and_preserves_approval
      - run: cargo build --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
