name: Generate lockfile
on: [push]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.85.1
      - run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
