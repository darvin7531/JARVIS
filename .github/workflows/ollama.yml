name: Ollama smoke
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.89.0
      - name: Start pinned Ollama and pull small model
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama:0.6.8
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/ && break; sleep 1; done
          docker exec ollama ollama pull smollm2:135m-instruct-q4_0
          docker exec ollama ollama list | grep -F dbc9f6c89cb0
      - name: Run real inference
        env:
          JARVIS_OLLAMA_SMOKE: '1'
        run: cargo test --locked --test provider_ollama actual_ollama_smoke_when_enabled -- --nocapture
      - name: Stop runner
        if: always()
        run: docker rm -f ollama || true
